name: Pin Bar Level Confirmation Backtest

on:
  push:
    branches:
      - v2-pinbar-level-confirmation
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run backtest
        run: node scripts/run_public_backtest.mjs
