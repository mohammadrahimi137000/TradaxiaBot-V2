name: Pin Bar Ablation Backtest

on:
  push:
    branches:
      - v2-pinbar-ablation
  pull_request:
    branches:
      - v2-pinbar-level-confirmation
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run pin bar ablation backtest
        run: node scripts/run_pinbar_ablation.mjs
