name: Pin Bar Ablation V2

on:
  push:
    branches: ["v2-pinbar-ablation-v2"]
  pull_request:
    branches: ["v2-professional"]
    paths:
      - "scripts/run_pinbar_ablation_v2.mjs"
      - "core/**"
      - ".github/workflows/pinbar-ablation-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run ablation
        run: node scripts/run_pinbar_ablation_v2.mjs
